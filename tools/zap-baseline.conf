# zap-baseline.conf - ZAP passive-scan policy for web and api scans.
#
# Format (tab separated): <rule id> <ACTION> (<rule name>) <reason>
#   FAIL    finding a client should fix; makes ZAP exit non-zero
#   WARN    reported, lower priority (default for any rule not listed)
#   IGNORE  suppressed from the summary counts. Requires a reason in the
#           fourth column. report_summary.py lists every suppressed alert
#           with this reason, and the raw zap.json keeps it unmodified.
#           HIGH-risk alerts are never suppressed regardless of this file.
#
# Rule IDs: https://www.zaproxy.org/docs/alerts/

# --- FAIL: client-facing security weaknesses ---
10038	FAIL	(Content Security Policy (CSP) Header Not Set)
10055	FAIL	(CSP: Wildcard Directive / weak policy)
10020	FAIL	(Missing Anti-clickjacking Header)
10035	FAIL	(Strict-Transport-Security Header Not Set)
10021	FAIL	(X-Content-Type-Options Header Missing)
10098	FAIL	(Cross-Domain Misconfiguration)
3	FAIL	(Session ID in URL Rewrite)
10010	FAIL	(Cookie No HttpOnly Flag)
10011	FAIL	(Cookie Without Secure Flag)
10054	FAIL	(Cookie without SameSite Attribute)

# --- IGNORE: informational or high false-positive rules (reason required) ---
10096	IGNORE	(Timestamp Disclosure - Unix)	Matches any 10-digit number in responses; high false-positive rate and no exploit path on its own.
10109	IGNORE	(Modern Web Application)	Informational detection that the site is a JavaScript app; describes the target, not a weakness.
10015	IGNORE	(Re-examine Cache-control Directives)	Informational caching review prompt; a cache weakness on sensitive pages is reported by other rules.
10049	IGNORE	(Content Cacheability (storable / non-storable))	Informational cacheability classification; not a security weakness by itself.
90004	IGNORE	(Cross-Origin-Embedder/Opener-Policy Header Missing)	Only relevant to sites that require cross-origin isolation; absent that need it is hardening noise.
